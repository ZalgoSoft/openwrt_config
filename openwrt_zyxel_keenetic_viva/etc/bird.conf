log syslog all;
log stderr all;
router id 1.2.3.4;
protocol device openwrt {
    scan time 29;
}
protocol kernel kernel_routes {
    scan time 31;
    ipv4 {
        import none;
        export all;
    };
}
filter acceptfilter {
		if (65445, 643) ~ bgp_community then { reject; }
                gw = 10.0.0.2;
#                ifname = "tun0";
                accept;
}
protocol bgp peer_65444 {
    local as 64999;
    neighbor 45.148.244.55 as 65444;
    multihop;
    hold time 243;
    ipv4 {
        import filter acceptfilter;
        export none;
    };
}
